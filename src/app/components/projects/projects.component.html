<section class="projects" id="projects">
    <div class="projects-container">
      <div class="section-header fade-in-up">
        <p class="section-label">proyectos</p>
        <h2>Lo que he <span class="glow-text">construido</span></h2>
        <p class="section-subtitle">Proyectos personales y académicos que demuestran mis habilidades</p>
      </div>
  
      <div class="projects-grid">
        <article class="project-card fade-in-up" *ngFor="let p of projects; let i = index"
                 [class.featured]="p.featured"
                 [style.animation-delay]="(i * 0.15) + 's'">
  
          <div class="project-header">
            <div class="project-num">
              <span class="num-text">{{ (i+1).toString().padStart(2,'0') }}</span>
            </div>
            <div class="project-links">
              <a [href]="p.github" target="_blank" title="GitHub" *ngIf="p.github">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                  <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
              </a>
              <a [href]="p.live" target="_blank" title="Ver proyecto" *ngIf="p.live">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                  <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
              </a>
            </div>
          </div>
  
          <div class="project-visual">
            <div class="project-screen">
              <div class="screen-topbar">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              </div>
              <div class="screen-content">
                <img [src]="p.image" [alt]="p.title" class="project-img">
              </div>
            </div>
          </div>
  
          <div class="project-body">
            <h3>{{ p.title }}</h3>
            <p>{{ p.description }}</p>
          </div>
  
          <div class="project-tags">
            <span class="tag" *ngFor="let tag of p.tags">{{ tag }}</span>
          </div>
  
          <div class="project-badge" *ngIf="p.featured">
            <span>⭐ Destacado</span>
          </div>
        </article>
      </div>
  
      <div class="projects-cta fade-in-up">
        <p>¿Quieres ver más de mi trabajo?</p>
        <a href="https://github.com/angelmg777" target="_blank" class="btn-primary">
          Ver GitHub completo
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
      </div>
    </div>
  </section>
